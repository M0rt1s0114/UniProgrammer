[package]
name = "chip-validator"
version = "0.4.0-alpha.2"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.31"
rusb = "0.9"
serialport = "4.2"
open = "5"
toml = "0.8"
semver = "1"
base64 = "0.22"
rquickjs = "0.12.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 硬件抽象层后端：
#  - 都不启用：按平台自动选择（Windows -> DLL，其他 -> libusb）
#  - hal-dll     ：强制 CH34X.DLL（仅 Windows 有意义）
#  - hal-libusb ：强制 libusb/rusb（Windows 调试或 Linux 正常路径）
hal-dll = []
hal-libusb = []
