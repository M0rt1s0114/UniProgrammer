# L1 必需插件：Tauri UI 壳。
# 主窗口直接加载 unipkg://localhost/uni.tauri/，由 L0 的 unipkg 协议
# 从本插件包的 dist 目录提供页面，因此整个 UI 壳可以整包替换。
[package]
name = "uni.tauri"
version = "1.0.0"
plugin_api = 1
kind = "ui"
layer = "required"
entry = "dist/index.html"
provider = "builtin"

