# L1 必需插件：Tauri UI 的十六进制视图贡献页。
# 命名 `uni.tauri.hexview` 表示它依附于 `uni.tauri` 壳；
# 将来 Slint 壳对应 `uni.slint.hexview`。
[package]
name = "uni.tauri.hexview"
version = "1.0.0"
plugin_api = 1
kind = "ui"
layer = "required"
entry = "dist/index.html"
provider = "builtin"

[dependencies]
"uni.tauri" = "^1"

[permissions]

[capabilities]
