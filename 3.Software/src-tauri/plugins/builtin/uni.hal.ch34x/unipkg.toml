# L2 冷启动插件：CH34X（CH341A / CH347T / CH347F）USB SPI 编程器适配器。
# 适配器进程为 sidecar 形态，通过 uni-hal 的 v1 sidecar 协议与 L0 通信；
# 崩溃隔离在独立进程内，不会影响主程序。内置冷启动插件默认启用，
# 可在插件管理器中禁用（重启后生效）。
[package]
name = "uni.hal.ch34x"
version = "1.0.0"
plugin_api = 1
kind = "adapter"
layer = "cold"
entry = "uni_ch34x_sidecar"
provider = "builtin"
os = ["windows", "linux", "macos"]
arch = ["x86_64", "aarch64"]

[dependencies]
"uni.hal" = "^1"

[permissions]
usb = true

[capabilities.spi]
enabled = true
pins = { cs = "CS0", sck = "SCK", mosi = "MOSI", miso = "MISO" }
max_frame = 4092
max_freq_khz = 60000
