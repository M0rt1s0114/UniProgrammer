[package]
name = "uni-devices"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
autobins = false

[dependencies]
base64 = "0.22"
rusb = "0.9"
serialport = "4.2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[features]
default = []
hal-dll = []
hal-libusb = []

# 同一个 sidecar 源码，按后端分别编译成两个可执行文件，
# 供 uni.hal.ch34x_dll / uni.hal.ch34x_libusb 两个插件包使用。
[[bin]]
name = "uni_ch34x_sidecar"
path = "src/bin/uni_ch34x_sidecar.rs"

[[bin]]
name = "uni_ch34x_sidecar_dll"
path = "src/bin/uni_ch34x_sidecar_dll.rs"
required-features = ["hal-dll"]

[[bin]]
name = "uni_ch34x_sidecar_libusb"
path = "src/bin/uni_ch34x_sidecar_libusb.rs"
required-features = ["hal-libusb"]
