# L2 冷启动插件：CH34X（CH341A / CH347T / CH347F）libusb 后端。
# 无需厂商 DLL；设备需安装 WinUSB/libusb 驱动（例如用 Zadig 替换）。
[package]
name = "upt.hal.ch34x_libusb"
version = "1.0.0"
plugin_api = 1
kind = "adapter"
layer = "cold"
entry = "upt_ch34x_sidecar_libusb"
provider = "builtin"
os = ["windows", "linux", "macos"]
arch = ["x86_64", "aarch64"]

[dependencies]
"upt.hal" = "^1"

[permissions]
usb = true

[capabilities.spi]
enabled = true
pins = { cs = "CS0", sck = "SCK", mosi = "MOSI", miso = "MISO" }
max_frame = 4092
max_freq_khz = 60000
